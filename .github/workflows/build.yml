name: SonarQube
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      - name: Start SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"kmlyteixeira_garage-management-api-dotnet" /o:"kmlyteixeira" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml" /d:sonar.coverage.exclusions="**/Migrations/**,**/GarageManagement.DbMigrator/**,**/GarageManagement.HttpApi.Client/**,**/GarageManagement.HttpApi/**,src/GarageManagement.HttpApi.Host/GarageManagementHttpApiHostModule.cs,**/*Dto.cs,**/*CreateDto.cs,**/*UpdateDto.cs,**/*CreateUpdateDto.cs,**/*GetListInputDto.cs,src/GarageManagement.Domain/Data/GarageManagementDbMigrationService.cs,src/GarageManagement.EntityFrameworkCore/EntityFrameworkCore/GarageManagementDbContextFactory.cs,src/GarageManagement.HttpApi.Host/Program.cs,test/GarageManagement.HttpApi.Client.ConsoleTestApp/Program.cs, src/GarageManagement.HttpApi.Host/SwaggerTagDescriptionFilter.cs"

      - name: Build solution
        shell: powershell
        run: dotnet build

      - name: Run tests
        shell: powershell
        run: |
          dotnet test .\test\GarageManagement.Domain.Tests\GarageManagement.Domain.Tests.csproj --no-build --collect:"XPlat Code Coverage" --results-directory .\TestResults
          dotnet test .\test\GarageManagement.Application.Tests\GarageManagement.Application.Tests.csproj --no-build --collect:"XPlat Code Coverage" --results-directory .\TestResults
          dotnet test .\test\GarageManagement.EntityFrameworkCore.Tests\GarageManagement.EntityFrameworkCore.Tests.csproj --no-build --collect:"XPlat Code Coverage" --results-directory .\TestResults

      - name: Finish SonarQube analysis
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
