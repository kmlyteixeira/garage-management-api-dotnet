# In CI, the real Secret is generated from the Terraform rds_endpoint/rds_port/rds_database_name
# outputs plus the TF_VAR_db_password/STRING_ENCRYPTION_PASSPHRASE secrets, e.g.:
#
#   kubectl create secret generic api-secret \
#     --namespace garage-management \
#     --from-literal=ConnectionStrings__Default="Host=<rds_endpoint>;Port=<rds_port>;Database=<rds_database_name>;User ID=<db_username>;Password=<db_password>;" \
#     --from-literal=StringEncryption__DefaultPassPhrase="<string_encryption_passphrase>" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# For a local/manual deploy, copy this file to secret.yaml, fill in real values, then
# `kubectl apply -f k8s/api/secret.yaml` before `kubectl apply -k k8s/`.
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: garage-management
type: Opaque
stringData:
  ConnectionStrings__Default: "Host=CHANGE_ME;Port=5432;Database=CHANGE_ME;User ID=CHANGE_ME;Password=CHANGE_ME;"
  StringEncryption__DefaultPassPhrase: "CHANGE_ME_STRONG_PASSPHRASE"
