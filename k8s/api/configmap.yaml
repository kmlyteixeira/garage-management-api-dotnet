apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: garage-management
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  # Replace with the real public URL of the api Service (LoadBalancer DNS or your own domain)
  # once it is known - Swagger's OAuth flow and CORS depend on this matching the actual origin.
  App__SelfUrl: "http://CHANGE_ME.example.com"
  App__CorsOrigins: "http://CHANGE_ME.example.com"
  App__RedirectAllowedUrls: "http://CHANGE_ME.example.com"
  AuthServer__Authority: "http://CHANGE_ME.example.com"
  AuthServer__RequireHttpsMetadata: "false"
  AuthServer__SwaggerClientId: "GarageManagement_Swagger"
  # Consumed by the db-migrator Job, not by the api Deployment itself.
  OpenIddict__Applications__GarageManagement_Swagger__RootUrl: "http://CHANGE_ME.example.com"
