apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: garage-management
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  # Replace with the real public URL of the api Service (LoadBalancer DNS or your own domain).
  # The deploy workflow replaces CHANGE_ME.example.com with the full http://... URL.
  App__SelfUrl: "CHANGE_ME.example.com"
  App__CorsOrigins: "CHANGE_ME.example.com"
  App__RedirectAllowedUrls: "CHANGE_ME.example.com"
  AuthServer__Authority: "CHANGE_ME.example.com"
  AuthServer__RequireHttpsMetadata: "false"
  AuthServer__SwaggerClientId: "GarageManagement_Swagger"
  # Consumed by the db-migrator Job, not by the api Deployment itself.
  OpenIddict__Applications__GarageManagement_Swagger__RootUrl: "CHANGE_ME.example.com"
  # Read by SmtpSettingsDataSeedContributor (db-migrator), which pushes these into ABP Setting
  # Management via ISettingManager so the SMTP password gets encrypted before it's persisted.
  # Smtp__UserName/Password live in api-secret since Gmail requires the From address to match
  # the authenticated account.
  Smtp__DefaultFromDisplayName: "Garage Management"
  Smtp__Host: "smtp.gmail.com"
  Smtp__Port: "587"
  Smtp__EnableSsl: "true"
  Smtp__UseDefaultCredentials: "false"
