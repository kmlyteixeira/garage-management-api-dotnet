# OWASP ZAP Configuration File
# Usado para customizar o comportamento da varredura

# Configurações gerais de varredura
rules.cookie.httponly=true
rules.cookie.secure=false

# Timeout da varredura (em milisegundos)
timeout.request=30000

# Configurações de Spider (rastreador)
spider.maxdepth=3
spider.threads=4
spider.timeout=30

# Configurações de Active Scan (scan ativo)
activescan.policy=API_PASSIVE

# Headers de segurança esperados
rules.header.xcontenttypeoptions.enabled=true
rules.header.xframeoptions.enabled=true
rules.header.xxssprotection.enabled=true
rules.header.stricttransportsecurity.enabled=false

# CORS
rules.cors.enabled=true

# SQL Injection
rules.sqli.enabled=true

# XSS
rules.xss.enabled=true

# CSRF
rules.csrf.enabled=true

# Authentication
rules.auth.enabled=true

# Excludes (padrões URL a ignorar)
# Adicione endpoints que não devem ser scaneados
exclude.url.pattern=.*\\/metrics.*
exclude.url.pattern=.*\\/health.*
exclude.url.pattern=.*\\/swagger.*

# Include patterns (padrões URL a incluir)
include.url.pattern=.*\\/api\\/.*

# Configurações de relatório
report.includePassiveAlerts=true
report.includeAlerts=true
